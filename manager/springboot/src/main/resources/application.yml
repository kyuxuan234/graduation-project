server:
  port: 9090

# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root   #你本地的数据库用户名
    password: 123456 #你本地的数据库密码
    url: jdbc:mysql://localhost:3306/manager?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
  mail:
    # 授权码来自 .env 的 MAIL_PASSWORD（启动前写入系统属性）。留空则不发信，也不阻断启动。
    host: ${MAIL_HOST:smtp.yeah.net}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:yuxuan236@yeah.net}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# 配置mybatis实体和xml映射
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.entity
  configuration:
    map-underscore-to-camel-case: true

# 分页
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

ip: localhost

file:
  upload-dir: ${FILE_UPLOAD_DIR:files}

# SSH 凭据密钥。留空则明文保存并打警告，不阻断启动。生产 profile 必须注入。
credential:
  key: ${CREDENTIAL_KEY:}

# JWT 签名密钥。不要再用用户密码哈希当密钥：BCrypt 密文含 $ 且与查询路径不一致时会导致登录后全部 401。
jwt:
  secret: ${JWT_SECRET:devops-jwt-local-secret-2026}

deploy:
  execution:
    pool-size: 2
    queue-capacity: 50
    max-retry: 2
    timeout-seconds: 300
  # SSH 主机密钥校验档位（替代原先“无条件信任任意主机密钥”的行为）：
  #   accept-new  —— TOFU（首次信任）。主机不在 known_hosts 时记录其指纹并放行；
  #                  再次连接时校验指纹，密钥变更则拒绝连接。默认档，兼顾安全与首次可用。
  #   known-hosts —— 只信任 known_hosts 中已有条目，未知主机直接拒绝。生产建议档。
  #   off         —— 不校验主机密钥（等价旧的“无条件信任”行为），存在中间人风险，
  #                  仅限 dev 排障，需显式开启；生产环境禁止使用。
  ssh:
    host-key-check: accept-new
    # known_hosts 文件路径。accept-new 首次连接会在此写入目标机指纹，父目录不存在会自动创建。
    known-hosts: ${user.dir}/data/known_hosts

# 探活默认开启。本地 application-dev.yml 会关掉，避免没有 SSH 目标时刷告警。
healthcheck:
  enabled: true
  server-cron: "0 */2 * * * ?"
  app-cron: "30 */2 * * * ?"
  auto-alarm-cooldown-minutes: 30

# 只开放健康检查。端口与 server.port 相同，健康检查走 9090，不另开管理端口。
# 邮件未配置时不发信，也不该把 /actuator/health 打成 DOWN。
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  server:
    port: 9090