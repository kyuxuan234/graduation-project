# MySQL 官方镜像只在数据卷为空的首次启动时执行 /docker-entrypoint-initdb.d/ 下的脚本。
# 首次部署（mysql-data 为空）会自动执行 schema.sql、data.sql，建表并灌入初始数据。
# 卷里一旦有数据，再改 schema.sql 然后 docker compose up，这些脚本不会重跑，改动不生效。
# 这时只能手工执行 SQL，或者 docker compose down -v 清空卷后重来（库里的数据会丢）。
# upgrade_*.sql 不挂进初始化目录：它们是给已有库升级的，全新安装用 schema.sql 就够。

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      # 后端是另一个容器。不设的话 root 只能从 mysql 容器内部登录，backend 会 Access denied。
      MYSQL_ROOT_HOST: "%"
      # 容器默认 UTC。DATETIME 的 CURRENT_TIMESTAMP 跟 MySQL 时区走，不跟 JVM。
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./springboot/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./springboot/src/main/resources/sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 首次初始化要建库并执行 schema.sql，健康检查在这之前打 3306 会失败。
      # start_period 内的失败不计入 retries。
      start_period: 180s

  backend:
    image: manager-backend:latest
    build: ./springboot
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 容器里必须连服务名 mysql。.env 的 DB_HOST=localhost 只给本机开发，不能传进容器。
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # application-prod.yml 绑定的是 DB_URL，不是拆开的 DB_HOST。
      DB_URL: "jdbc:mysql://mysql:3306/${DB_NAME}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY}
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/files:/app/files
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: manager-frontend:latest
    build: ./vue
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
