# 本地开发：数据源允许默认账号，生产 profile 禁止内置密码
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    # 默认值为本地开发占位口令，生产环境见 application-prod.yml（强制环境变量注入）
    password: ${DB_PASSWORD:123456}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:manager}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true

# 本地开发占位密钥，只用于加密演示数据，不能拿到生产环境用。
credential:
  key: ${CREDENTIAL_KEY:dev-credential-key}

jwt:
  secret: ${JWT_SECRET:devops-jwt-local-secret-2026}

healthcheck:
  enabled: false
