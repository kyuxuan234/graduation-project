server:
  port: 9090

# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root   #你本地的数据库用户名
    password: 123456 #你本地的数据库密码
    url: jdbc:mysql://localhost:3306/manager?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
  mail:
    # 授权码来自 .env 的 MAIL_PASSWORD（启动前写入系统属性）。留空则不发信，也不阻断启动。
    host: ${MAIL_HOST:smtp.yeah.net}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:yuxuan236@yeah.net}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# 配置mybatis实体和xml映射
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.entity
  configuration:
    map-underscore-to-camel-case: true

# 分页
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

ip: localhost

file:
  upload-dir: ${FILE_UPLOAD_DIR:files}

# SSH 凭据密钥。留空则明文保存并打警告，不阻断启动。生产 profile 必须注入。
credential:
  key: ${CREDENTIAL_KEY:}

deploy:
  execution:
    pool-size: 2
    queue-capacity: 50
    max-retry: 2
    timeout-seconds: 300

# 探活默认开启。本地 application-dev.yml 会关掉，避免没有 SSH 目标时刷告警。
healthcheck:
  enabled: true
  server-cron: "0 */2 * * * ?"
  app-cron: "30 */2 * * * ?"
  auto-alarm-cooldown-minutes: 30

# 只开放健康检查。端口与 server.port 相同，健康检查走 9090，不另开管理端口。
# 邮件未配置时不发信，也不该把 /actuator/health 打成 DOWN。
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  server:
    port: 9090