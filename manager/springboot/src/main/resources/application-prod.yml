# 生产：禁止内置数据库密码与 JWT 默认密钥，必须通过环境变量注入
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL}

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

credential:
  key: ${CREDENTIAL_KEY}

healthcheck:
  enabled: true
